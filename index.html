<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Planner</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
               "Segoe UI", sans-serif;
  background: #f5f5f7;
  color: #171717;
}

button, input, textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  max-width: 1100px;
  margin: auto;
  min-height: 100vh;
  padding: 28px;
}

/* TOP */

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 28px;
}

.logo {
  font-size: 27px;
  font-weight: 750;
  letter-spacing: -1px;
}

.top-right {
  display: flex;
  gap: 8px;
}

.top-btn {
  border: 1px solid #ddd;
  background: white;
  border-radius: 12px;
  padding: 9px 14px;
  color: #222;
}

/* NAV */

.nav {
  display: flex;
  gap: 8px;
  margin-bottom: 28px;
  border-bottom: 1px solid #ddd;
}

.nav button {
  background: transparent;
  border: none;
  padding: 12px 15px;
  color: #777;
  font-weight: 600;
  border-bottom: 2px solid transparent;
}

.nav button.active {
  color: #111;
  border-bottom-color: #111;
}

/* HOME */

.date-title {
  font-size: 15px;
  color: #777;
  margin-bottom: 5px;
}

.big-date {
  font-size: 36px;
  font-weight: 750;
  letter-spacing: -1.5px;
  margin-bottom: 25px;
}

.section-title {
  font-size: 19px;
  font-weight: 700;
  margin: 24px 0 12px;
}

.task-list {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.task {
  background: white;
  border: 1px solid #e5e5e5;
  border-radius: 14px;
  padding: 14px;
  display: flex;
  align-items: center;
  gap: 13px;
  transition: .15s;
}

.task:hover {
  transform: translateY(-1px);
  border-color: #ccc;
}

.check {
  width: 21px;
  height: 21px;
  border: 1.5px solid #aaa;
  border-radius: 50%;
  background: white;
  flex-shrink: 0;
}

.check.done {
  background: #1f1f1f;
  border-color: #1f1f1f;
  position: relative;
}

.check.done::after {
  content: "✓";
  color: white;
  font-size: 13px;
  position: absolute;
  left: 4px;
  top: 1px;
}

.task-content {
  flex: 1;
}

.task-title {
  font-weight: 650;
}

.task-sub {
  font-size: 13px;
  color: #777;
  margin-top: 3px;
}

.importance {
  width: 8px;
  height: 38px;
  border-radius: 5px;
}

.red { background: #ff3b30; }
.orange { background: #ff9500; }
.yellow { background: #ffcc00; }
.green { background: #34c759; }

.delete {
  border: none;
  background: transparent;
  color: #aaa;
  font-size: 18px;
}

/* ADD BUTTON */

.add-main {
  position: fixed;
  right: 30px;
  bottom: 30px;
  width: 62px;
  height: 62px;
  border: none;
  border-radius: 50%;
  background: #111;
  color: white;
  font-size: 31px;
  box-shadow: 0 8px 25px rgba(0,0,0,.2);
  z-index: 10;
}

/* CALENDAR */

.calendar-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}

.calendar-title {
  font-size: 28px;
  font-weight: 750;
}

.month-buttons button {
  border: 1px solid #ddd;
  background: white;
  border-radius: 10px;
  width: 38px;
  height: 36px;
  margin-left: 5px;
}

.calendar {
  background: white;
  border: 1px solid #ddd;
  border-radius: 18px;
  overflow: hidden;
}

.weekdays,
.days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
}

.weekday {
  padding: 12px 5px;
  text-align: center;
  color: #888;
  font-size: 12px;
  border-bottom: 1px solid #eee;
}

.day {
  min-height: 105px;
  padding: 9px;
  border-right: 1px solid #eee;
  border-bottom: 1px solid #eee;
  cursor: pointer;
}

.day:nth-child(7n) {
  border-right: none;
}

.day-number {
  font-size: 13px;
  font-weight: 650;
}

.today .day-number {
  background: #111;
  color: white;
  border-radius: 50%;
  width: 25px;
  height: 25px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.calendar-item {
  margin-top: 7px;
  padding: 4px 6px;
  border-radius: 5px;
  font-size: 10px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.calendar-item.red-bg {
  background: #ffe5e3;
  color: #b42318;
}

.calendar-item.orange-bg {
  background: #fff0dc;
  color: #a85c00;
}

.calendar-item.yellow-bg {
  background: #fff8cf;
  color: #8a7200;
}

.calendar-item.green-bg {
  background: #e1f8e7;
  color: #187333;
}

/* MODAL */

.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.35);
  z-index: 50;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.overlay.show {
  display: flex;
}

.modal {
  width: min(480px, 100%);
  background: white;
  border-radius: 22px;
  padding: 24px;
  box-shadow: 0 20px 60px rgba(0,0,0,.25);
  max-height: 90vh;
  overflow-y: auto;
}

.modal h2 {
  margin: 0 0 20px;
  font-size: 25px;
}

.add-choice {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.choice {
  padding: 22px 10px;
  border: 1px solid #ddd;
  background: #fafafa;
  border-radius: 15px;
  font-size: 16px;
  font-weight: 650;
}

.choice:hover {
  background: #f1f1f1;
}

.form {
  display: none;
}

.form.show {
  display: block;
}

label {
  display: block;
  font-size: 13px;
  color: #666;
  margin: 13px 0 6px;
}

input, textarea, select {
  width: 100%;
  padding: 12px;
  border: 1px solid #d7d7d7;
  border-radius: 10px;
  background: #fafafa;
  outline: none;
}

textarea {
  min-height: 80px;
  resize: vertical;
}

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.importance-options {
  display: flex;
  gap: 9px;
}

.imp {
  width: 42px;
  height: 38px;
  border: 2px solid transparent;
  border-radius: 9px;
}

.imp.selected {
  border-color: #111;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 20px;
}

.cancel {
  border: 1px solid #ddd;
  background: white;
  padding: 11px 16px;
  border-radius: 10px;
}

.save {
  border: none;
  background: #111;
  color: white;
  padding: 11px 18px;
  border-radius: 10px;
  font-weight: 650;
}

/* DAY DETAILS */

.detail-item {
  padding: 13px 0;
  border-bottom: 1px solid #eee;
}

.detail-item:last-child {
  border-bottom: none;
}

.detail-title {
  font-weight: 700;
}

.detail-info {
  color: #777;
  font-size: 13px;
  margin-top: 4px;
}

.type-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .5px;
  color: #999;
  margin-bottom: 3px;
}

/* HIDDEN */

.page {
  display: none;
}

.page.active {
  display: block;
}

/* MOBILE */

@media (max-width: 650px) {
  .app {
    padding: 18px;
  }

  .big-date {
    font-size: 30px;
  }

  .day {
    min-height: 75px;
    padding: 5px;
  }

  .calendar-item {
    font-size: 8px;
  }

  .weekday {
    font-size: 10px;
  }

  .add-main {
    right: 20px;
    bottom: 20px;
  }

  .nav {
    overflow-x: auto;
  }

  .nav button {
    white-space: nowrap;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="top">
    <div class="logo">Study Planner</div>
    <div class="top-right">
      <button class="top-btn" onclick="goToday()">Today</button>
    </div>
  </div>

  <div class="nav">
    <button id="homeNav" class="active" onclick="showPage('home')">Home</button>
    <button id="calendarNav" onclick="showPage('calendar')">Calendar</button>
  </div>

  <!-- HOME -->

  <section id="home" class="page active">

    <div class="date-title" id="homeDate"></div>
    <div class="big-date" id="homeDay"></div>

    <div class="section-title">Your checklist</div>

    <div id="taskList" class="task-list"></div>

  </section>

  <!-- CALENDAR -->

  <section id="calendar" class="page">

    <div class="calendar-head">
      <div class="calendar-title" id="calendarTitle"></div>

      <div class="month-buttons">
        <button onclick="changeMonth(-1)">‹</button>
        <button onclick="changeMonth(1)">›</button>
      </div>
    </div>

    <div class="calendar">

      <div class="weekdays">
        <div class="weekday">MON</div>
        <div class="weekday">TUE</div>
        <div class="weekday">WED</div>
        <div class="weekday">THU</div>
        <div class="weekday">FRI</div>
        <div class="weekday">SAT</div>
        <div class="weekday">SUN</div>
      </div>

      <div id="calendarDays" class="days"></div>

    </div>

  </section>

</div>

<button class="add-main" onclick="openAdd()">+</button>


<!-- ADD MODAL -->

<div id="addOverlay" class="overlay">

  <div class="modal">

    <div id="chooseType">

      <h2>Add</h2>

      <div class="add-choice">

        <button class="choice" onclick="chooseSubject()">
          📚<br><br>Subject
        </button>

        <button class="choice" onclick="chooseEvent()">
          📅<br><br>Event
        </button>

      </div>

    </div>


    <!-- SUBJECT FORM -->

    <div id="subjectForm" class="form">

      <h2>Add Subject</h2>

      <label>Subject</label>
      <input id="subjectName" placeholder="e.g. Math">

      <label>What is it?</label>
      <select id="subjectKind">
        <option value="Homework">Homework</option>
        <option value="Test">Test</option>
        <option value="Study">Study</option>
      </select>

      <label>Title</label>
      <input id="subjectTitle" placeholder="e.g. Fractions test">

      <label>Importance</label>

      <div class="importance-options">
        <button class="imp red selected" onclick="selectImportance('red', this)"></button>
        <button class="imp orange" onclick="selectImportance('orange', this)"></button>
        <button class="imp yellow" onclick="selectImportance('yellow', this)"></button>
        <button class="imp green" onclick="selectImportance('green', this)"></button>
      </div>

      <div class="row">

        <div>
          <label>Date</label>
          <input type="date" id="subjectDate">
        </div>

        <div>
          <label>Time</label>
          <input type="time" id="subjectTime">
        </div>

      </div>

      <label>Notes</label>
      <textarea id="subjectNotes" placeholder="Anything you need to remember..."></textarea>

      <div class="modal-actions">
        <button class="cancel" onclick="closeModal()">Cancel</button>
        <button class="save" onclick="saveSubject()">Add Subject</button>
      </div>

    </div>


    <!-- EVENT FORM -->

    <div id="eventForm" class="form">

      <h2>Add Event</h2>

      <label>Event</label>
      <input id="eventName" placeholder="e.g. School trip">

      <label>Location</label>
      <input id="eventLocation" placeholder="e.g. Zermatt">

      <label>Importance</label>

      <div class="importance-options">
        <button class="imp red" onclick="selectImportance('red', this)"></button>
        <button class="imp orange selected" onclick="selectImportance('orange', this)"></button>
        <button class="imp yellow" onclick="selectImportance('yellow', this)"></button>
        <button class="imp green" onclick="selectImportance('green', this)"></button>
      </div>

      <div class="row">

        <div>
          <label>Date</label>
          <input type="date" id="eventDate">
        </div>

        <div>
          <label>Start</label>
          <input type="time" id="eventStart">
        </div>

      </div>

      <label>End</label>
      <input type="time" id="eventEnd">

      <label>Notes</label>
      <textarea id="eventNotes" placeholder="Anything you need to remember..."></textarea>

      <div class="modal-actions">
        <button class="cancel" onclick="closeModal()">Cancel</button>
        <button class="save" onclick="saveEvent()">Add Event</button>
      </div>

    </div>

  </div>

</div>


<!-- DAY DETAILS -->

<div id="dayOverlay" class="overlay">

  <div class="modal">

    <h2 id="detailDate"></h2>

    <div id="detailList"></div>

    <div class="modal-actions">
      <button class="cancel" onclick="closeDay()">Close</button>
    </div>

  </div>

</div>


<script>

let items = JSON.parse(localStorage.getItem("studyPlannerItems") || "[]");

let currentMonth = new Date();

let selectedImportance = "red";

const today = new Date();


/* SAVE */

function saveData() {
  localStorage.setItem("studyPlannerItems", JSON.stringify(items));
}


/* NAVIGATION */

function showPage(page) {

  document.querySelectorAll(".page").forEach(p => {
    p.classList.remove("active");
  });

  document.getElementById(page).classList.add("active");

  document.querySelectorAll(".nav button").forEach(b => {
    b.classList.remove("active");
  });

  if (page === "home") {
    document.getElementById("homeNav").classList.add("active");
  }

  if (page === "calendar") {
    document.getElementById("calendarNav").classList.add("active");
    renderCalendar();
  }

}


/* HOME */

function renderHome() {

  const weekdays = [
    "Sunday","Monday","Tuesday","Wednesday",
    "Thursday","Friday","Saturday"
  ];

  const months = [
    "January","February","March","April","May","June",
    "July","August","September","October","November","December"
  ];

  document.getElementById("homeDate").textContent =
    months[today.getMonth()] + " " +
    today.getDate() + ", " +
    today.getFullYear();

  document.getElementById("homeDay").textContent =
    weekdays[today.getDay()];

  const todayString = formatDate(today);

  let todaysItems = items.filter(x => x.date === todayString);

  todaysItems.sort((a,b) => {
    return (a.time || "").localeCompare(b.time || "");
  });

  const list = document.getElementById("taskList");

  if (todaysItems.length === 0) {

    list.innerHTML = `
      <div style="
        padding:35px 10px;
        color:#888;
        text-align:center;
      ">
        Nothing planned for today.
      </div>
    `;

    return;
  }

  list.innerHTML = todaysItems.map(item => {

    let subtitle = "";

    if (item.type === "subject") {
      subtitle =
        `${item.subject} · ${item.kind}` +
        (item.time ? ` · ${item.time}` : "");
    }

    if (item.type === "event") {
      subtitle =
        `Event` +
        (item.location ? ` · ${item.location}` : "") +
        (item.start ? ` · ${item.start}` : "");
    }

    return `
      <div class="task">

        <button
          class="check ${item.done ? "done" : ""}"
          onclick="toggleDone('${item.id}')">
        </button>

        <div class="task-content">

          <div class="task-title">
            ${escapeHtml(item.title)}
          </div>

          <div class="task-sub">
            ${escapeHtml(subtitle)}
          </div>

        </div>

        <div class="importance ${item.importance}"></div>

        <button
          class="delete"
          onclick="deleteItem('${item.id}')">
          ×
        </button>

      </div>
    `;

  }).join("");

}


/* CALENDAR */

function renderCalendar() {

  const year = currentMonth.getFullYear();
  const month = currentMonth.getMonth();

  const months = [
    "January","February","March","April","May","June",
    "July","August","September","October","November","December"
  ];

  document.getElementById("calendarTitle").textContent =
    months[month] + " " + year;

  const firstDay = new Date(year, month, 1);

  let startDay = firstDay.getDay();

  // Monday = 0
  startDay = startDay === 0 ? 6 : startDay - 1;

  const daysInMonth =
    new Date(year, month + 1, 0).getDate();

  const container =
    document.getElementById("calendarDays");

  container.innerHTML = "";

  // Empty spaces before first day

  for (let i = 0; i < startDay; i++) {
    container.innerHTML += `<div class="day"></div>`;
  }

  for (let day = 1; day <= daysInMonth; day++) {

    const date = new Date(year, month, day);
    const dateString = formatDate(date);

    const isToday =
      dateString === formatDate(today);

    const dayItems =
      items.filter(x => x.date === dateString);

    let html = `
      <div class="day ${isToday ? "today" : ""}"
           onclick="openDay('${dateString}')">

        <div class="day-number">${day}</div>
    `;

    dayItems.slice(0,3).forEach(item => {

      html += `
        <div class="calendar-item ${item.importance}-bg">
          ${item.type === "event" ? "📅 " : ""}
          ${escapeHtml(item.title)}
        </div>
      `;

    });

    if (dayItems.length > 3) {
      html += `
        <div style="font-size:10px;color:#888;margin-top:4px">
          +${dayItems.length - 3} more
        </div>
      `;
    }

    html += `</div>`;

    container.innerHTML += html;

  }

}


/* MONTH */

function changeMonth(amount) {

  currentMonth.setMonth(
    currentMonth.getMonth() + amount
  );

  renderCalendar();

}


/* TODAY */

function goToday() {

  currentMonth = new Date();

  showPage("home");

}


/* ADD */

function openAdd() {

  document.getElementById("addOverlay")
    .classList.add("show");

  document.getElementById("chooseType")
    .style.display = "block";

  document.getElementById("subjectForm")
    .classList.remove("show");

  document.getElementById("eventForm")
    .classList.remove("show");

}


function chooseSubject() {

  document.getElementById("chooseType")
    .style.display = "none";

  document.getElementById("subjectForm")
    .classList.add("show");

  selectedImportance = "red";

  const date = formatDate(today);

  document.getElementById("subjectDate").value = date;

}


function chooseEvent() {

  document.getElementById("chooseType")
    .style.display = "none";

  document.getElementById("eventForm")
    .classList.add("show");

  selectedImportance = "orange";

  document.getElementById("eventDate").value =
    formatDate(today);

}


function closeModal() {

  document.getElementById("addOverlay")
    .classList.remove("show");

}


/* IMPORTANCE */

function selectImportance(level, button) {

  selectedImportance = level;

  button.parentElement
    .querySelectorAll(".imp")
    .forEach(b => b.classList.remove("selected"));

  button.classList.add("selected");

}


/* SAVE SUBJECT */

function saveSubject() {

  const subject =
    document.getElementById("subjectName").value.trim();

  const title =
    document.getElementById("subjectTitle").value.trim();

  const kind =
    document.getElementById("subjectKind").value;

  const date =
    document.getElementById("subjectDate").value;

  const time =
    document.getElementById("subjectTime").value;

  const notes =
    document.getElementById("subjectNotes").value.trim();

  if (!subject || !title || !date) {

    alert("Please enter the subject, title and date.");

    return;
  }

  items.push({

    id: Date.now().toString(),

    type: "subject",

    subject,
    title,
    kind,
    date,
    time,
    notes,

    importance: selectedImportance,

    done: false

  });

  saveData();

  clearForms();

  closeModal();

  renderHome();

  renderCalendar();

}


/* SAVE EVENT */

function saveEvent() {

  const title =
    document.getElementById("eventName").value.trim();

  const location =
    document.getElementById("eventLocation").value.trim();

  const date =
    document.getElementById("eventDate").value;

  const start =
    document.getElementById("eventStart").value;

  const end =
    document.getElementById("eventEnd").value;

  const notes =
    document.getElementById("eventNotes").value.trim();

  if (!title || !date) {

    alert("Please enter an event name and date.");

    return;
  }

  items.push({

    id: Date.now().toString(),

    type: "event",

    title,
    location,
    date,
    start,
    end,
    notes,

    importance: selectedImportance,

    done: false

  });

  saveData();

  clearForms();

  closeModal();

  renderHome();

  renderCalendar();

}


/* CLEAR */

function clearForms() {

  document.querySelectorAll(
    "#subjectForm input, #subjectForm textarea, #eventForm input, #eventForm textarea"
  ).forEach(input => {

    if (input.type !== "date") {
      input.value = "";
    }

  });

}


/* COMPLETE */

function toggleDone(id) {

  const item = items.find(x => x.id === id);

  if (!item) return;

  item.done = !item.done;

  saveData();

  renderHome();

  renderCalendar();

}


/* DELETE */

function deleteItem(id) {

  items = items.filter(x => x.id !== id);

  saveData();

  renderHome();

  renderCalendar();

}


/* DAY DETAILS */

function openDay(dateString) {

  const date = new Date(dateString + "T12:00:00");

  const formatted =
    date.toLocaleDateString("en-GB", {
      weekday: "long",
      day: "numeric",
      month: "long"
    });

  document.getElementById("detailDate").textContent =
    formatted;

  const dayItems =
    items.filter(x => x.date === dateString);

  const list =
    document.getElementById("detailList");

  if (dayItems.length === 0) {

    list.innerHTML =
      `<div style="color:#888">Nothing planned.</div>`;

  } else {

    list.innerHTML = dayItems.map(item => {

      if (item.type === "subject") {

        return `
          <div class="detail-item">

            <div class="type-label">Subject</div>

            <div class="detail-title">
              ${escapeHtml(item.title)}
            </div>

            <div class="detail-info">
              📚 ${escapeHtml(item.subject)}
              · ${escapeHtml(item.kind)}
              ${item.time ? " · " + item.time : ""}
            </div>

            ${
              item.notes
              ? `<div class="detail-info">
                   ${escapeHtml(item.notes)}
                 </div>`
              : ""
            }

          </div>
        `;

      }

      return `
        <div class="detail-item">

          <div class="type-label">Event</div>

          <div class="detail-title">
            📅 ${escapeHtml(item.title)}
          </div>

          <div class="detail-info">
            ${item.location ? "📍 " + escapeHtml(item.location) : ""}
            ${item.start ? " · " + item.start : ""}
            ${item.end ? "–" + item.end : ""}
          </div>

          ${
            item.notes
            ? `<div class="detail-info">
                 ${escapeHtml(item.notes)}
               </div>`
            : ""
          }

        </div>
      `;

    }).join("");

  }

  document.getElementById("dayOverlay")
    .classList.add("show");

}


function closeDay() {

  document.getElementById("dayOverlay")
    .classList.remove("show");

}


/* DATE */

function formatDate(date) {

  const y = date.getFullYear();

  const m = String(
    date.getMonth() + 1
  ).padStart(2,"0");

  const d = String(
    date.getDate()
  ).padStart(2,"0");

  return `${y}-${m}-${d}`;

}


/* SECURITY */

function escapeHtml(text) {

  return String(text || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* START */

renderHome();
renderCalendar();

</script>
