<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Planner</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f7f8;
  color: #171717;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
               "Segoe UI", sans-serif;
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  max-width: 1050px;
  margin: auto;
  padding: 25px;
  min-height: 100vh;
}

/* HEADER */

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
}

.logo {
  font-size: 25px;
  font-weight: 750;
  letter-spacing: -1px;
}

.today-button {
  background: white;
  border: 1px solid #ddd;
  padding: 9px 15px;
  border-radius: 10px;
}

/* NAVIGATION */

.nav {
  display: flex;
  gap: 25px;
  border-bottom: 1px solid #ddd;
  margin-bottom: 25px;
}

.nav button {
  border: 0;
  background: none;
  padding: 10px 2px;
  color: #888;
  font-weight: 600;
  border-bottom: 2px solid transparent;
}

.nav button.active {
  color: #111;
  border-bottom-color: #111;
}

/* DAY NAVIGATION */

.day-navigation {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
}

.day-info {
  text-align: center;
}

.day-week {
  font-size: 13px;
  color: #888;
  text-transform: uppercase;
  letter-spacing: .7px;
}

.day-number {
  font-size: 34px;
  font-weight: 750;
  letter-spacing: -1.5px;
  margin-top: 3px;
}

.arrow {
  width: 42px;
  height: 42px;
  border: 1px solid #ddd;
  background: white;
  border-radius: 12px;
  font-size: 22px;
}

/* CHECKLIST */

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.section-title {
  font-size: 18px;
  font-weight: 700;
}

.item-count {
  font-size: 13px;
  color: #888;
}

.task-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.task {
  display: flex;
  align-items: center;
  gap: 13px;
  background: white;
  border: 1px solid #e5e5e5;
  border-radius: 13px;
  padding: 14px;
}

.check {
  width: 21px;
  height: 21px;
  border-radius: 50%;
  border: 1.5px solid #aaa;
  background: white;
  flex-shrink: 0;
}

.check.done {
  background: #111;
  border-color: #111;
  color: white;
}

.check.done::after {
  content: "✓";
  font-size: 13px;
}

.task-main {
  flex: 1;
}

.task-title {
  font-weight: 650;
}

.task-info {
  color: #888;
  font-size: 13px;
  margin-top: 4px;
}

.importance {
  width: 7px;
  height: 35px;
  border-radius: 5px;
}

.red {
  background: #ff3b30;
}

.orange {
  background: #ff9500;
}

.yellow {
  background: #ffcc00;
}

.green {
  background: #34c759;
}

.delete {
  border: 0;
  background: none;
  color: #aaa;
  font-size: 20px;
}

.empty {
  padding: 45px 10px;
  text-align: center;
  color: #999;
}

/* CALENDAR */

.calendar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.calendar-month {
  font-size: 28px;
  font-weight: 750;
}

.month-buttons button {
  width: 38px;
  height: 36px;
  border: 1px solid #ddd;
  background: white;
  border-radius: 9px;
  margin-left: 5px;
}

.calendar {
  background: white;
  border: 1px solid #ddd;
  border-radius: 16px;
  overflow: hidden;
}

.weekdays,
.days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
}

.weekday {
  text-align: center;
  padding: 12px 4px;
  font-size: 11px;
  color: #888;
  border-bottom: 1px solid #eee;
}

.calendar-day {
  min-height: 105px;
  padding: 8px;
  border-right: 1px solid #eee;
  border-bottom: 1px solid #eee;
  cursor: pointer;
  transition: background .15s;
}

.calendar-day:hover {
  background: #f7f7f7;
}

.calendar-day:nth-child(7n) {
  border-right: 0;
}

.calendar-number {
  font-size: 13px;
  font-weight: 650;
}

.calendar-day.today .calendar-number {
  background: #111;
  color: white;
  width: 25px;
  height: 25px;
  display: flex;
  justify-content: center;
  align-items: center;
  border-radius: 50%;
}

.calendar-day.selected {
  background: #eeeeef;
}

.calendar-item {
  margin-top: 6px;
  padding: 4px 6px;
  border-radius: 5px;
  font-size: 10px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.calendar-item.red {
  background: #ffe5e3;
  color: #b42318;
}

.calendar-item.orange {
  background: #fff0dc;
  color: #a85c00;
}

.calendar-item.yellow {
  background: #fff8cf;
  color: #806c00;
}

.calendar-item.green {
  background: #e1f8e7;
  color: #187333;
}

/* ADD BUTTON */

.add-button {
  position: fixed;
  right: 28px;
  bottom: 28px;
  width: 60px;
  height: 60px;
  border: 0;
  border-radius: 50%;
  background: #111;
  color: white;
  font-size: 30px;
  box-shadow: 0 8px 25px rgba(0,0,0,.2);
  z-index: 10;
}

/* MODAL */

.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.35);
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 20;
}

.overlay.show {
  display: flex;
}

.modal {
  width: min(480px, 100%);
  max-height: 90vh;
  overflow-y: auto;
  background: white;
  border-radius: 20px;
  padding: 24px;
}

.modal h2 {
  margin-top: 0;
}

.choices {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.choice {
  padding: 25px 10px;
  background: #fafafa;
  border: 1px solid #ddd;
  border-radius: 14px;
  font-weight: 650;
}

.form {
  display: none;
}

.form.show {
  display: block;
}

label {
  display: block;
  margin: 13px 0 6px;
  font-size: 13px;
  color: #666;
}

input,
textarea,
select {
  width: 100%;
  border: 1px solid #d5d5d5;
  background: #fafafa;
  border-radius: 9px;
  padding: 11px;
  outline: none;
}

textarea {
  min-height: 75px;
  resize: vertical;
}

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.importance-options {
  display: flex;
  gap: 9px;
}

.imp {
  width: 42px;
  height: 36px;
  border: 2px solid transparent;
  border-radius: 8px;
}

.imp.selected {
  border-color: #111;
}

.form-buttons {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 20px;
}

.cancel {
  background: white;
  border: 1px solid #ddd;
  padding: 10px 15px;
  border-radius: 9px;
}

.save {
  background: #111;
  color: white;
  border: 0;
  padding: 10px 16px;
  border-radius: 9px;
  font-weight: 650;
}

/* PAGES */

.page {
  display: none;
}

.page.active {
  display: block;
}

/* MOBILE */

@media(max-width:650px) {

  .app {
    padding: 18px;
  }

  .day-number {
    font-size: 28px;
  }

  .calendar-day {
    min-height: 75px;
    padding: 5px;
  }

  .calendar-item {
    font-size: 8px;
  }

  .add-button {
    right: 20px;
    bottom: 20px;
  }

  .nav {
    gap: 20px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <header class="header">

    <div class="logo">
      Study Planner
    </div>

    <button class="today-button" onclick="goToday()">
      Today
    </button>

  </header>


  <!-- NAVIGATION -->

  <nav class="nav">

    <button
      id="homeNav"
      class="active"
      onclick="showPage('home')">
      Planner
    </button>

    <button
      id="calendarNav"
      onclick="showPage('calendar')">
      Calendar
    </button>

  </nav>


  <!-- PLANNER -->

  <main id="home" class="page active">

    <div class="day-navigation">

      <button
        class="arrow"
        onclick="changeDay(-1)">
        ‹
      </button>


      <div class="day-info">

        <div
          id="selectedWeekday"
          class="day-week">
        </div>

        <div
          id="selectedDate"
          class="day-number">
        </div>

      </div>


      <button
        class="arrow"
        onclick="changeDay(1)">
        ›
      </button>

    </div>


    <div class="section-header">

      <div class="section-title">
        Checklist
      </div>

      <div
        id="itemCount"
        class="item-count">
      </div>

    </div>


    <div
      id="taskList"
      class="task-list">
    </div>

  </main>


  <!-- CALENDAR -->

  <main id="calendar" class="page">

    <div class="calendar-header">

      <div
        id="calendarMonth"
        class="calendar-month">
      </div>

      <div class="month-buttons">

        <button onclick="changeMonth(-1)">
          ‹
        </button>

        <button onclick="changeMonth(1)">
          ›
        </button>

      </div>

    </div>


    <div class="calendar">

      <div class="weekdays">

        <div class="weekday">MON</div>
        <div class="weekday">TUE</div>
        <div class="weekday">WED</div>
        <div class="weekday">THU</div>
        <div class="weekday">FRI</div>
        <div class="weekday">SAT</div>
        <div class="weekday">SUN</div>

      </div>


      <div
        id="calendarDays"
        class="days">
      </div>

    </div>

  </main>

</div>


<!-- ADD BUTTON -->

<button
  class="add-button"
  onclick="openAdd()">
  +
</button>


<!-- ADD MODAL -->

<div
  id="addOverlay"
  class="overlay">

  <div class="modal">


    <!-- CHOOSE -->

    <div id="chooseType">

      <h2>Add</h2>

      <div class="choices">

        <button
          class="choice"
          onclick="openSubjectForm()">

          📚
          <br><br>
          Subject

        </button>


        <button
          class="choice"
          onclick="openEventForm()">

          📅
          <br><br>
          Event

        </button>

      </div>

    </div>


    <!-- SUBJECT FORM -->

    <div
      id="subjectForm"
      class="form">

      <h2>New Subject</h2>


      <label>
        Subject
      </label>

      <input
        id="subjectName"
        placeholder="Math">


      <label>
        Title
      </label>

      <input
        id="subjectTitle"
        placeholder="Fractions test">


      <label>
        Type
      </label>

      <select id="subjectType">

        <option value="Test">
          Test
        </option>

        <option value="Homework">
          Homework
        </option>

        <option value="Study">
          Study
        </option>

      </select>


      <label>
        Importance
      </label>


      <div class="importance-options">

        <button
          class="imp red selected"
          onclick="selectImportance('red',this)">
        </button>

        <button
          class="imp orange"
          onclick="selectImportance('orange',this)">
        </button>

        <button
          class="imp yellow"
          onclick="selectImportance('yellow',this)">
        </button>

        <button
          class="imp green"
          onclick="selectImportance('green',this)">
        </button>

      </div>


      <div class="row">

        <div>

          <label>
            Date
          </label>

          <input
            id="subjectDate"
            type="date">

        </div>


        <div>

          <label>
            Time
          </label>

          <input
            id="subjectTime"
            type="time">

        </div>

      </div>


      <label>
        Notes
      </label>

      <textarea
        id="subjectNotes"
        placeholder="What do you need to remember?">
      </textarea>


      <div class="form-buttons">

        <button
          class="cancel"
          onclick="closeModal()">
          Cancel
        </button>

        <button
          class="save"
          onclick="saveSubject()">
          Add Subject
        </button>

      </div>

    </div>


    <!-- EVENT FORM -->

    <div
      id="eventForm"
      class="form">

      <h2>New Event</h2>


      <label>
        Event
      </label>

      <input
        id="eventName"
        placeholder="School trip">


      <label>
        Location
      </label>

      <input
        id="eventLocation"
        placeholder="Zermatt">


      <label>
        Importance
      </label>


      <div class="importance-options">

        <button
          class="imp red"
          onclick="selectImportance('red',this)">
        </button>

        <button
          class="imp orange selected"
          onclick="selectImportance('orange',this)">
        </button>

        <button
          class="imp yellow"
          onclick="selectImportance('yellow',this)">
        </button>

        <button
          class="imp green"
          onclick="selectImportance('green',this)">
        </button>

      </div>


      <div class="row">

        <div>

          <label>
            Date
          </label>

          <input
            id="eventDate"
            type="date">

        </div>


        <div>

          <label>
            Start
          </label>

          <input
            id="eventStart"
            type="time">

        </div>

      </div>


      <label>
        End
      </label>

      <input
        id="eventEnd"
        type="time">


      <label>
        Notes
      </label>

      <textarea
        id="eventNotes"
        placeholder="Anything you need to remember?">
      </textarea>


      <div class="form-buttons">

        <button
          class="cancel"
          onclick="closeModal()">
          Cancel
        </button>

        <button
          class="save"
          onclick="saveEvent()">
          Add Event
        </button>

      </div>

    </div>

  </div>

</div>


<script>

/* =========================================
   DATA
========================================= */

let items = JSON.parse(
  localStorage.getItem("studyPlannerItems") || "[]"
);


/*
  THIS IS THE IMPORTANT DATE.

  Whatever date is selected here is the date
  shown on the Planner/Home screen.
*/

let selectedDate = new Date();

let calendarDate = new Date();

let selectedImportance = "red";


/* =========================================
   DATE FUNCTIONS
========================================= */

function formatDate(date) {

  const year =
    date.getFullYear();

  const month =
    String(date.getMonth() + 1)
      .padStart(2, "0");

  const day =
    String(date.getDate())
      .padStart(2, "0");

  return `${year}-${month}-${day}`;
}


function saveData() {

  localStorage.setItem(
    "studyPlannerItems",
    JSON.stringify(items)
  );

}


function escapeHtml(text) {

  return String(text || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================
   DAY NAVIGATION
========================================= */

function changeDay(amount) {

  selectedDate.setDate(
    selectedDate.getDate() + amount
  );

  /*
    Keep calendar on the selected date's month
  */

  calendarDate = new Date(selectedDate);

  renderPlanner();

  renderCalendar();

}


function goToday() {

  selectedDate = new Date();

  calendarDate = new Date();

  renderPlanner();

  renderCalendar();

  showPage("home");

}


/* =========================================
   PLANNER / HOME
========================================= */

function renderPlanner() {

  const weekday =
    selectedDate.toLocaleDateString(
      "en-US",
      {
        weekday: "long"
      }
    );


  const date =
    selectedDate.toLocaleDateString(
      "en-US",
      {
        day: "numeric",
        month: "long",
        year: "numeric"
      }
    );


  document.getElementById(
    "selectedWeekday"
  ).textContent = weekday;


  document.getElementById(
    "selectedDate"
  ).textContent = date;


  const dateString =
    formatDate(selectedDate);


  let dayItems =
    items.filter(
      item => item.date === dateString
    );


  /*
    Sort by time
  */

  dayItems.sort((a, b) => {

    const timeA =
      a.time ||
      a.start ||
      "99:99";

    const timeB =
      b.time ||
      b.start ||
      "99:99";

    return timeA.localeCompare(timeB);

  });


  document.getElementById(
    "itemCount"
  ).textContent =
    dayItems.length +
    (dayItems.length === 1
      ? " item"
      : " items");


  const list =
    document.getElementById(
      "taskList"
    );


  if (dayItems.length === 0) {

    list.innerHTML = `
      <div class="empty">
        Nothing planned for this day.
      </div>
    `;

    return;

  }


  list.innerHTML =
    dayItems.map(item => {

      let info = "";


      if (item.type === "subject") {

        info =
          `${escapeHtml(item.subject)} · ` +
          `${escapeHtml(item.kind)}` +
          (
            item.time
              ? ` · ${escapeHtml(item.time)}`
              : ""
          );

      }


      if (item.type === "event") {

        info =
          `Event` +
          (
            item.location
              ? ` · ${escapeHtml(item.location)}`
              : ""
          ) +
          (
            item.start
              ? ` · ${escapeHtml(item.start)}`
              : ""
          );

      }


      return `

        <div class="task">

          <button
            class="check ${item.done ? "done" : ""}"
            onclick="toggleDone('${item.id}')">
          </button>


          <div class="task-main">

            <div class="task-title">

              ${
                item.type === "event"
                  ? "📅 "
                  : ""
              }

              ${escapeHtml(item.title)}

            </div>


            <div class="task-info">
              ${info}
            </div>

          </div>


          <div
            class="importance ${item.importance}">
          </div>


          <button
            class="delete"
            onclick="deleteItem('${item.id}')">
            ×
          </button>

        </div>

      `;

    }).join("");

}


/* =========================================
   CALENDAR
========================================= */

function renderCalendar() {

  const year =
    calendarDate.getFullYear();

  const month =
    calendarDate.getMonth();


  document.getElementById(
    "calendarMonth"
  ).textContent =
    calendarDate.toLocaleDateString(
      "en-US",
      {
        month: "long",
        year: "numeric"
      }
    );


  /*
    Find first weekday.

    JavaScript:
    Sunday = 0
    Monday = 1
    etc.

    We convert it so Monday = 0.
  */

  const firstDay =
    new Date(year, month, 1);


  let start =
    firstDay.getDay();


  start =
    start === 0
      ? 6
      : start - 1;


  const daysInMonth =
    new Date(
      year,
      month + 1,
      0
    ).getDate();


  const container =
    document.getElementById(
      "calendarDays"
    );


  container.innerHTML = "";


  /*
    Empty spaces before first day
  */

  for (let i = 0; i < start; i++) {

    container.innerHTML +=
      `<div class="calendar-day"></div>`;

  }


  /*
    Create every day
  */

  for (
    let day = 1;
    day <= daysInMonth;
    day++
  ) {

    const date =
      new Date(
        year,
        month,
        day
      );


    const dateString =
      formatDate(date);


    const dayItems =
      items.filter(
        item =>
          item.date === dateString
      );


    const isToday =
      dateString ===
      formatDate(new Date());


    const isSelected =
      dateString ===
      formatDate(selectedDate);


    let html = `

      <div
        class="
          calendar-day
          ${isToday ? "today" : ""}
          ${isSelected ? "selected" : ""}
        "
        onclick="
          selectCalendarDay('${dateString}')
        "
      >

        <div class="calendar-number">
          ${day}
        </div>

    `;


    /*
      Show up to 3 things on each date
    */

    dayItems
      .slice(0, 3)
      .forEach(item => {

        html += `

          <div
            class="
              calendar-item
              ${item.importance}
            "
          >

            ${
              item.type === "event"
                ? "📅 "
                : ""
            }

            ${escapeHtml(item.title)}

          </div>

        `;

      });


    if (dayItems.length > 3) {

      html += `

        <div style="
          font-size:9px;
          color:#888;
          margin-top:4px;
        ">

          +${dayItems.length - 3} more

        </div>

      `;

    }


    html += `
      </div>
    `;


    container.innerHTML += html;

  }

}


/*
  ⭐ IMPORTANT ⭐

  When you click a date on the calendar:

  1. selectedDate becomes that date
  2. Planner updates
  3. Calendar updates
  4. App switches to Planner/Home
*/

function selectCalendarDay(dateString) {

  selectedDate =
    new Date(
      dateString + "T12:00:00"
    );


  /*
    Make the calendar follow
    the selected date too.
  */

  calendarDate =
    new Date(selectedDate);


  /*
    Update the Home/Planner
  */

  renderPlanner();


  /*
    Update calendar highlighting
  */

  renderCalendar();


  /*
    ⭐ GO TO HOME/PLANNER ⭐
  */

  showPage("home");

}


/* =========================================
   MONTH NAVIGATION
========================================= */

function changeMonth(amount) {

  calendarDate.setMonth(
    calendarDate.getMonth() + amount
  );

  renderCalendar();

}


/* =========================================
   PAGE NAVIGATION
========================================= */

function showPage(page) {

  document
    .querySelectorAll(".page")
    .forEach(p => {

      p.classList.remove("active");

    });


  document
    .getElementById(page)
    .classList.add("active");


  document
    .querySelectorAll(".nav button")
    .forEach(button => {

      button.classList.remove("active");

    });


  if (page === "home") {

    document
      .getElementById("homeNav")
      .classList.add("active");

  }


  if (page === "calendar") {

    document
      .getElementById("calendarNav")
      .classList.add("active");

    renderCalendar();

  }

}


/* =========================================
   ADD WINDOW
========================================= */

function openAdd() {

  document
    .getElementById("addOverlay")
    .classList.add("show");


  document
    .getElementById("chooseType")
    .style.display = "block";


  document
    .getElementById("subjectForm")
    .classList.remove("show");


  document
    .getElementById("eventForm")
    .classList.remove("show");

}


function openSubjectForm() {

  document
    .getElementById("chooseType")
    .style.display = "none";


  document
    .getElementById("subjectForm")
    .classList.add("show");


  selectedImportance = "red";


  /*
    ⭐ USE THE CURRENTLY SELECTED DAY ⭐
  */

  document
    .getElementById("subjectDate")
    .value =
    formatDate(selectedDate);

}


function openEventForm() {

  document
    .getElementById("chooseType")
    .style.display = "none";


  document
    .getElementById("eventForm")
    .classList.add("show");


  selectedImportance = "orange";


  /*
    ⭐ USE THE CURRENTLY SELECTED DAY ⭐
  */

  document
    .getElementById("eventDate")
    .value =
    formatDate(selectedDate);

}


function closeModal() {

  document
    .getElementById("addOverlay")
    .classList.remove("show");

}


/* =========================================
   IMPORTANCE
========================================= */

function selectImportance(
  level,
  button
) {

  selectedImportance = level;


  button.parentElement
    .querySelectorAll(".imp")
    .forEach(b => {

      b.classList.remove(
        "selected"
      );

    });


  button.classList.add(
    "selected"
  );

}


/* =========================================
   SAVE SUBJECT
========================================= */

function saveSubject() {

  const subject =
    document
      .getElementById("subjectName")
      .value
      .trim();


  const title =
    document
      .getElementById("subjectTitle")
      .value
      .trim();


  const kind =
    document
      .getElementById("subjectType")
      .value;


  const date =
    document
      .getElementById("subjectDate")
      .value;


  const time =
    document
      .getElementById("subjectTime")
      .value;


  const notes =
    document
      .getElementById("subjectNotes")
      .value
      .trim();


  if (
    !subject ||
    !title ||
    !date
  ) {

    alert(
      "Please enter a subject, title and date."
    );

    return;

  }


  items.push({

    id:
      Date.now().toString(),

    type:
      "subject",

    subject:
      subject,

    title:
      title,

    kind:
      kind,

    date:
      date,

    time:
      time,

    notes:
      notes,

    importance:
      selectedImportance,

    done:
      false

  });


  saveData();

  clearForms();

  closeModal();

  /*
    Make sure the Planner
    switches to the item's date.
  */

  selectedDate =
    new Date(
      date + "T12:00:00"
    );

  calendarDate =
    new Date(selectedDate);


  renderPlanner();

  renderCalendar();

}


/* =========================================
   SAVE EVENT
========================================= */

function saveEvent() {

  const title =
    document
      .getElementById("eventName")
      .value
      .trim();


  const location =
    document
      .getElementById("eventLocation")
      .value
      .trim();


  const date =
    document
      .getElementById("eventDate")
      .value;


  const start =
    document
      .getElementById("eventStart")
      .value;


  const end =
    document
      .getElementById("eventEnd")
      .value;


  const notes =
    document
      .getElementById("eventNotes")
      .value
      .trim();


  if (!title || !date) {

    alert(
      "Please enter an event and date."
    );

    return;

  }


  items.push({

    id:
      Date.now().toString(),

    type:
      "event",

    title:
      title,

    location:
      location,

    date:
      date,

    start:
      start,

    end:
      end,

    notes:
      notes,

    importance:
      selectedImportance,

    done:
      false

  });


  saveData();

  clearForms();

  closeModal();


  /*
    Switch Planner
    to the event's date.
  */

  selectedDate =
    new Date(
      date + "T12:00:00"
    );

  calendarDate =
    new Date(selectedDate);


  renderPlanner();

  renderCalendar();

}


/* =========================================
   CLEAR FORMS
========================================= */

function clearForms() {

  document
    .querySelectorAll(
      "#subjectForm input, " +
      "#subjectForm textarea, " +
      "#eventForm input, " +
      "#eventForm textarea"
    )
    .forEach(input => {

      if (
        input.type !== "date"
      ) {

        input.value = "";

      }

    });

}


/* =========================================
   CHECK OFF
========================================= */

function toggleDone(id) {

  const item =
    items.find(
      x => x.id === id
    );


  if (!item) return;


  item.done =
    !item.done;


  saveData();

  renderPlanner();

  renderCalendar();

}


/* =========================================
   DELETE
========================================= */

function deleteItem(id) {

  items =
    items.filter(
      x => x.id !== id
    );


  saveData();

  renderPlanner();

  renderCalendar();

}


/* =========================================
   START APP
========================================= */

renderPlanner();

renderCalendar();

</script>

</body>
</html>
